version: '3.8'
services:
  app:
    build:
      context: .
    ports:
      - "3847:3000"
    environment:
      - AI_API_URL=${AI_API_URL}
      - AI_API_KEY=${AI_API_KEY}
      - BRAVE_API_KEY=${BRAVE_API_KEY}
      - CRON_SECRET=${CRON_SECRET}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-${COOLIFY_FQDN:-http://localhost:3847}}
    restart: unless-stopped